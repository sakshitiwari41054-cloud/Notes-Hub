<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Add a Note | NotesHub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin { padding: 28px 0 56px; max-width: 760px; }
    .admin h1 { margin: 0 0 6px; font-size: 1.7rem; }
    .admin .lead { margin: 0 0 22px; color: var(--muted); }
    .form { display: grid; gap: 16px; }
    .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field label { font-weight: 700; font-size: .92rem; }
    .field .hint { color: var(--muted); font-size: .82rem; font-weight: 400; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    }
    .field textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem; line-height: 1.5; }
    .out { margin-top: 26px; }
    .out pre { margin: 0; padding: 14px; border-radius: 12px; background: var(--code-bg); color: var(--code-ink); overflow-x: auto; font-size: .85rem; line-height: 1.5; max-height: 360px; }
    .steps { margin: 16px 0 0; padding-left: 20px; color: var(--muted); }
    .steps li { margin-bottom: 6px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .actions .btn { margin-top: 0; }
    .err { color: #f87171; font-weight: 600; margin: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">📚</span>
        <span class="brand-name">NotesHub</span>
      </a>
      <span style="flex:1"></span>
      <a class="btn ghost" style="margin:0; text-decoration:none" href="index.html">View site</a>
    </div>
  </header>

  <main class="wrap admin">
    <h1>Add a note, question or quiz MCQ</h1>
    <p class="lead">Fill in the form, generate the code, and paste it into <code>notes-data.js</code> (notes and questions) or <code>quiz-data.js</code> (quiz MCQs). No server needed.</p>

    <form id="form" class="form" autocomplete="off">
      <div class="two">
        <div class="field">
          <label for="subject">Subject</label>
          <select id="subject">
            <option value="fundamentals">Computer Fundamentals</option>
            <option value="ds">Data Structures</option>
            <option value="dbms">DBMS</option>
            <option value="graphics">Computer Graphics</option>
            <option value="oops">OOPs</option>
            <option value="java">Java</option>
            <option value="python">Python</option>
            <option value="c">C</option>
            <option value="cpp">C++</option>
          </select>
        </div>
        <div class="field">
          <label for="type">Type</label>
          <select id="type">
            <option value="note">Note</option>
            <option value="question">Question</option>
            <option value="mcq">Quiz question (MCQ)</option>
          </select>
        </div>
        <div class="field" id="levelField">
          <label for="level">Level</label>
          <select id="level">
            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>
          </select>
        </div>
        <div class="field" id="dateField">
          <label for="date">Date</label>
          <input id="date" type="date">
        </div>
      </div>

      <div class="two" id="titleRow">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" type="text" placeholder="for example: Inheritance in Java">
        </div>
        <div class="field">
          <label for="topic">Topic</label>
          <input id="topic" type="text" placeholder="for example: OOP">
        </div>
      </div>

      <div class="field" id="contentField">
        <label for="content">Note content
          <span class="hint">## heading, **bold**, @@code@@, - list, ~~~java ... ~~~ code block</span>
        </label>
        <textarea id="content"></textarea>
      </div>

      <div class="field" id="questionField" hidden>
        <label for="question">Question</label>
        <textarea id="question"></textarea>
      </div>

      <div class="field" id="answerField" hidden>
        <label for="answer">Answer</label>
        <textarea id="answer"></textarea>
      </div>

      <div class="field" id="mcqFields" hidden>
        <div class="field">
          <label for="mq">Quiz question
            <span class="hint">You can use @@code@@ and **bold**</span>
          </label>
          <textarea id="mq" style="min-height:80px"></textarea>
        </div>
        <div class="two">
          <div class="field"><label for="o0">Option A</label><input id="o0" type="text"></div>
          <div class="field"><label for="o1">Option B</label><input id="o1" type="text"></div>
          <div class="field"><label for="o2">Option C</label><input id="o2" type="text"></div>
          <div class="field"><label for="o3">Option D</label><input id="o3" type="text"></div>
        </div>
        <div class="field">
          <label for="ans">Correct option</label>
          <select id="ans">
            <option value="0">A</option>
            <option value="1">B</option>
            <option value="2">C</option>
            <option value="3">D</option>
          </select>
        </div>
        <div class="field">
          <label for="expl">Short explanation (shown after the student answers)</label>
          <textarea id="expl" style="min-height:70px"></textarea>
        </div>
      </div>

      <div class="field" id="fileField">
        <label for="file">PDF path (optional)
          <span class="hint">Put the PDF in the <code>files</code> folder, then enter its path here, for example <code>files/java/inheritance.pdf</code></span>
        </label>
        <input id="file" type="text" placeholder="files/java/inheritance.pdf">
      </div>

      <p class="err" id="err" role="alert" hidden></p>

      <div class="actions">
        <button class="btn" type="submit">Generate code</button>
      </div>
    </form>

    <section class="out" id="out" hidden>
      <h2>Generated code</h2>
      <pre><code id="code"></code></pre>
      <div class="actions" style="margin-top:12px">
        <button class="btn" id="copyBtn" type="button">Copy code</button>
      </div>
      <ol class="steps" id="steps"></ol>
    </section>
  </main>

  <script src="notes-data.js"></script>
  <script src="quiz-data.js"></script>
  <script>
    (function () {
      "use strict";
      var $ = function (id) { return document.getElementById(id); };

      // Default to today's date
      var now = new Date();
      var iso = now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
      $("date").value = iso;

      function syncType() {
        var t = $("type").value;
        var isQ = t === "question";
        var isM = t === "mcq";
        $("contentField").hidden = t !== "note";
        $("questionField").hidden = !isQ;
        $("answerField").hidden = !isQ;
        $("mcqFields").hidden = !isM;
        ["levelField", "dateField", "titleRow", "fileField"].forEach(function (id) { $(id).hidden = isM; });
      }
      $("type").addEventListener("change", syncType);
      syncType();

      function slug(s) {
        return s.toLowerCase()
          .replace(/\+\+/g, "pp")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 50);
      }

      function uniqueId(base) {
        var taken = {};
        (window.NOTES || []).forEach(function (n) { taken[n.id] = true; });
        var id = base, k = 2;
        while (taken[id]) { id = base + "-" + k; k++; }
        return id;
      }

      function showErr(msg) {
        $("err").textContent = msg;
        $("err").hidden = !msg;
      }

      $("form").addEventListener("submit", function (e) {
        e.preventDefault();
        showErr("");

        var type = $("type").value;
        var title = $("title").value.trim();
        var subject = $("subject").value;

        if (type === "mcq") { makeMcq(subject); return; }

        if (!title) { showErr("Please enter a title."); return; }

        var entry = {
          id: uniqueId(subject + "-" + (slug(title) || "note")),
          subject: subject,
          type: type,
          topic: $("topic").value.trim(),
          level: $("level").value,
          date: $("date").value,
          title: title
        };

        if (type === "note") {
          var c = $("content").value.trim();
          if (!c) { showErr("Please write the note content."); return; }
          entry.content = c;
        } else {
          var q = $("question").value.trim();
          var a = $("answer").value.trim();
          if (!q || !a) { showErr("Please write both the question and the answer."); return; }
          entry.question = q;
          entry.answer = a;
        }

        var file = $("file").value.trim();
        if (file) entry.file = file;

        // JSON is also a valid JavaScript object, so quotes and new lines stay safe.
        var text = JSON.stringify(entry, null, 2)
          .split("\n").map(function (l) { return "  " + l; }).join("\n") + ",";

        output(text, "notes-data.js", "window.NOTES = [");
      });

      function output(text, file, anchor) {
        $("code").textContent = text;
        $("steps").innerHTML =
          "<li>Open <code>" + file + "</code>.</li>" +
          "<li>Paste this code right below <code>" + anchor + "</code> (keep the comma at the end).</li>" +
          "<li>Save the file. Live Server will refresh the page automatically.</li>";
        $("out").hidden = false;
        $("out").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function makeMcq(subject) {
        var q = $("mq").value.trim();
        var opts = [0, 1, 2, 3].map(function (i) { return $("o" + i).value.trim(); });
        var expl = $("expl").value.trim();
        if (!q) { showErr("Please write the quiz question."); return; }
        if (opts.some(function (o) { return !o; })) { showErr("Please fill in all 4 options."); return; }
        if (!expl) { showErr("Please write a short explanation."); return; }
        var item = { s: subject, q: q, o: opts, a: +$("ans").value, e: expl };
        output("  " + JSON.stringify(item) + ",", "quiz-data.js", "window.QUIZ = [");
      }

      $("copyBtn").addEventListener("click", function () {
        var btn = this;
        var text = $("code").textContent;
        var done = function () {
          var old = btn.textContent;
          btn.textContent = "Copied";
          setTimeout(function () { btn.textContent = old; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done);
        } else {
          var ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); } catch (err) { /* ignore */ }
          document.body.removeChild(ta);
          done();
        }
      });
    })();
  </script>
</body>
</html>
